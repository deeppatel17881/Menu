<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a1a, #2b2b2b);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }

  .menu-card {
    max-width: 500px;
    width: 100%;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
  }

  .menu-card img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Desktop: allow a bit more height/space, keep it centered and not stretched */
  @media (min-width: 768px) {
    .menu-card {
      max-width: 480px;
    }
  }

  /* Mobile: full width with small padding */
  @media (max-width: 480px) {
    body {
      padding: 8px;
    }
    .menu-card {
      border-radius: 10px;
    }
  }
</style>
</head>
<body>

  <div class="menu-card">
    <img src="Menu.jpg" alt="Menu">
  </div>

</body>
</html>
